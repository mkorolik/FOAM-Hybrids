[tool.poetry]
name = "foamppkg"
version = "0.1.0"
description = "FOAM fork with combined g-mode/p-mode fitting (StORM, degree-splitting, joint-m rotation)"
authors = ["Maria Korolik"]
packages = [{ include = "foamppkg" }]

[tool.poetry.dependencies]
python = "^3.9"
numpy = "^1.21.2"
h5py = "^3.11.0"
matplotlib = "^3.4.3"
pandas = {extras = ["hdf5"], version = "^2.2.0"}
lmfit = "^1.0.3"
astropy = "^5.3.3"
hdfdict = "^0.3.1"
pyyaml = "^5.1,<5.4"
setuptools = "<80.10.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"